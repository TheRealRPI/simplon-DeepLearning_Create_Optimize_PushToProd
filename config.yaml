# =============================================================================
# BARRIÈRE QUALITÉ — Seuils minimaux d'acceptation du modèle
# =============================================================================
# Lu par src/deeplearning_create_optimize_pushtoprod/quality_gate.py,
# qui compare ces seuils aux métriques de model/metrics.json.
#
# Justification du seuil F1 :
# le seuil de 0,83 est fixé juste au-dessus du plancher
# F1_test − marge_de_bruit = 0,8608 − 0,0313 = 0,8295 :
# un modèle honnête garde donc sa marge de bruit,
# mais un modèle dégradé (F1 ≈ 0,5) est refusé.

f1_minimum: 0.83
test_size_minimum: 400

# =============================================================================
# MONITORING DU MODÈLE — lue par le package monitoring (P2, job batch)
# =============================================================================
# Les clés ci-dessus (f1_minimum, test_size_minimum) restent inchangées pour
# quality_gate.py. La section ci-dessous ne sert qu'au job de monitoring :
# il compare ces seuils aux métriques mesurées sur les logs JSONL et le
# golden set, puis sort : 0 (sain) / 1 (dérive ou régression) / 2 (données
# insuffisantes) / 3 (API injoignable).

monitoring:
  fenetre_jours: 30                # fenêtre glissante du trafic production
  fenetre_min_lignes: 100          # garde-fou : moins de lignes → exit 2, pas d'alerte
  drift_share_max: 0.30            # part max de colonnes en dérive (Evidently)
  value_drift_seuil: 0.30          # distance Wasserstein normée max PAR COLONNE.
                                   # Le défaut Evidently (0.1) sature sur le bruit
                                   # d'échantillonnage (fenêtre 150 lignes : 0.08–0.15
                                   # en trafic sain, mesuré en P2) ; 0.30 sépare le bruit
                                   # d'une vraie dérive (5.5 sur le jeu décalé).
  oov_rate_max: 0.70               # seuil d'alerte ABSOLU sur le signal principal.
                                   # Calibré sur la référence P0 : μ=0,536 σ=0,069 (les tokens
                                   # incluent les bigrammes, majoritairement hors vocabulaire)
                                   # → μ+2σ ≈ 0,67. La valeur 0,25 du plan initial était
                                   # ANTÉRIEURE à la mesure : elle aurait alerté en permanence.
  f1_minimum: 0.83                 # miroir de la barrière qualité (seuil d'alerte)
  f1_reference_golden_set: 0.8713  # BASELINE MESURÉE EN P0 (28/10/2026 : 400 lignes,
                                   # 0 erreur, via HTTP sur l'artefact servi) — ce n'est
                                   # PAS f1_score_test (0.8571, jeu de test seul)
