[project]
name = "deeplearning-create-optimize-pushtoprod"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "TheRealRPI", email = "TheRealRPI@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "ai-edge-litert>=2.3.0",
    "fastapi>=0.118.0",
    "httpx>=0.28.0",
    "ipykernel>=7.4.0",
    "joblib>=1.4.0",
    "keras-tuner>=1.4.7",
    "langdetect>=1.0.9",
    "matplotlib>=3.10.0",
    "optuna>=4.0.0",
    "pandas>=2.3.0",
    "pydantic>=2.10.0",
    "pytest>=8.3.0",
    "pyyaml>=6.0.2",
    "scikit-learn>=1.7.0",
    "tensorboard>=2.21.0",
    "tensorflow[and-cuda]>=2.21.0",
    "uvicorn>=0.32.0",
]

[project.scripts]
deeplearning-create-optimize-pushtoprod = "deeplearning_create_optimize_pushtoprod:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[dependency-groups]
dev = [
    "ruff>=0.17.1",
]
# Job de monitoring (P2) — OPT-IN : uv sync --group monitoring
# Jamais dans requirements.txt : l'image de service ne doit rien gagner (A1).
monitoring = [
    "evidently>=0.7,<0.8",  # API 0.7 (Report/DataDefinition) — les presets 0.4 ont été retirés
    "mlflow>=3,<4",         # registry (P4, bonus)
    "pandas>=2.3,<3.1",     # <3.1 : pandas 3.1 retire infer_dtype_from_object, importé par evidently.legacy
    "httpx>=0.28",
]
